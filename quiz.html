<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardware Quiz - T.Nuch SmartCom</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;500;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        /* สไตล์เดิมที่คุณครูชอบ (คงไว้ทั้งหมด) */
        :root { --neon: #00f2ff; --pink: #ff00cc; --success: #2ecc71; --error: #e74c3c; }
        body { font-family: 'Prompt', sans-serif; background: #050a14; color: white; text-align: center; margin: 0; padding: 20px; min-height: 100vh; }
        .container { max-width: 600px; margin: 20px auto; padding: 20px; background: rgba(255,255,255,0.05); border-radius: 20px; border: 1px solid var(--neon); box-shadow: 0 0 20px rgba(0, 242, 255, 0.2); }
        input { padding: 12px; border-radius: 10px; border: 1px solid var(--neon); width: 80%; margin: 10px 0; background: #0a1a33; color: white; font-family: 'Prompt'; font-size: 1rem; }
        .btn { padding: 15px 30px; background: var(--neon); color: #000; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; font-size: 1.1rem; margin: 10px; transition: 0.3s; }
        .choice-btn { display: block; width: 100%; padding: 15px; margin: 10px 0; background: rgba(255,255,255,0.1); border: 1px solid var(--neon); color: white; border-radius: 15px; cursor: pointer; text-align: left; font-size: 1.1rem; }
        .choice-btn.correct { background: var(--success) !important; }
        .choice-btn.wrong { background: var(--error) !important; }
        #timer { font-size: 1.5rem; color: var(--pink); font-weight: bold; margin-bottom: 10px; }
        .hidden { display: none !important; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border-bottom: 1px solid rgba(0, 242, 255, 0.1); }
        th { background: rgba(0, 242, 255, 0.2); color: var(--neon); }
    </style>
</head>
<body>

    <div class="container" id="setup-screen">
        <h2 style="color: var(--neon)">🎮 Hardware Quiz Game</h2>
        <p>กรุณากรอกชื่อเพื่อเริ่มทดสอบ</p>
        <input type="text" id="player-name" placeholder="ใส่ชื่อของคุณที่นี่...">
        <br>
        <button class="btn" onclick="startQuiz()">เริ่มทำข้อสอบ</button>
    </div>

    <div class="container hidden" id="already-done-screen">
        <h2 style="color: var(--pink)">⚠️ พบประวัติการทำข้อสอบ</h2>
        <p>คุณได้ทำการทดสอบไปเรียบร้อยแล้วครับ</p>
        <button class="btn" onclick="location.href='index.html'">กลับหน้าหลัก</button>
    </div>

    <div class="container hidden" id="quiz-screen">
        <div id="timer">เวลา: 0 วินาที</div>
        <h3 id="question-text">คำถาม...</h3>
        <div id="choices-container"></div>
        <p>ข้อที่ <span id="current-pos">1</span> / 10</p>
    </div>

    <div class="container hidden" id="result-screen">
        <h2 style="color: var(--neon);">สรุปคะแนน</h2>
        <p id="final-score"></p>
        <p id="final-time"></p>
        <button class="btn" onclick="location.href='index.html'">กลับหน้าหลัก</button>
    </div>

    <script>
        // ✅ 1. ตั้งค่า Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAK5UMFATyhnQlq3EDLmG7agFqTKh0BYCM",
            authDomain: "smartcom-ar-quiz.firebaseapp.com",
            projectId: "smartcom-ar-quiz",
            databaseURL: "https://smartcom-ar-quiz-default-rtdb.firebaseio.com/", // **ตรวจสอบ URL นี้ใน Firebase Console ของครูอีกครั้ง**
            storageBucket: "smartcom-ar-quiz.appspot.com",
            messagingSenderId: "367243958931",
            appId: "1:367243958931:web:3e3c66f54668b8ec66b8ec"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // ข้อมูลคำถาม
        const rawQuestions = [
            { q: "อุปกรณ์ใดเปรียบเสมือน 'สมอง' ของคอมพิวเตอร์?", c: ["RAM", "CPU", "SSD"], a: "CPU" },
            { q: "หน่วยความจำสำรองที่ช่วยให้เปิดเครื่องเร็วขึ้นคือ?", c: ["SSD", "PSU", "Mainboard"], a: "SSD" },
            { q: "อุปกรณ์ใดทำหน้าที่เก็บข้อมูลชั่วคราวขณะใช้งาน?", c: ["SSD", "CPU", "RAM"], a: "RAM" },
            { q: "ถ้าคอมพิวเตอร์ไม่มีอุปกรณ์นี้ จะจ่ายไฟเข้าเครื่องไม่ได้?", c: ["CASE", "PSU", "RAM"], a: "PSU" },
            { q: "แผงวงจรขนาดใหญ่ที่เชื่อมอุปกรณ์ทุกชิ้นเข้าด้วยกันคือ?", c: ["Mainboard", "SSD", "CPU"], a: "Mainboard" },
            { q: "ตัวถังที่ช่วยป้องกันฝุ่นและระบายความร้อนเรียกว่า?", c: ["PSU", "Mainboard", "CASE"], a: "CASE" },
            { q: "ความเร็วของ CPU มีหน่วยวัดเป็นอะไร?", c: ["Watt", "GHz", "GB"], a: "GHz" },
            { q: "RAM ย่อมาจากคำว่าอะไร?", c: ["Read Access Memory", "Random Access Memory", "Real Action Memory"], a: "Random Access Memory" },
            { q: "อุปกรณ์ใดต่อไปนี้ทนทานต่อแรงกระแทกได้ดีกว่า?", c: ["Hard Disk", "SSD", "CD-ROM"], a: "SSD" },
            { q: "Socket บนเมนบอร์ดมีไว้สำหรับใส่สิ่งใด?", c: ["CPU", "Power Cable", "Case Fan"], a: "CPU" }
        ];

        let questions = []; let currentQ = 0; let score = 0; let seconds = 0; let timerInterval;

        window.onload = function() {
            if (localStorage.getItem("hardware_quiz_done") === "true") {
                document.getElementById('setup-screen').classList.add('hidden');
                document.getElementById('already-done-screen').classList.remove('hidden');
            }
        };

        function startQuiz() {
            const name = document.getElementById('player-name').value;
            if(!name) return alert("กรุณาใส่ชื่อก่อนครับ");
            
            questions = rawQuestions.sort(() => Math.random() - 0.5).slice(0, 10);
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            
            timerInterval = setInterval(() => {
                seconds++;
                document.getElementById('timer').innerText = `เวลา: ${seconds} วินาที`;
            }, 1000);
            showQuestion();
        }

        function showQuestion() {
            const qData = questions[currentQ];
            document.getElementById('question-text').innerText = qData.q;
            document.getElementById('current-pos').innerText = currentQ + 1;
            const container = document.getElementById('choices-container');
            container.innerHTML = "";
            qData.c.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = "choice-btn";
                btn.innerText = choice;
                btn.onclick = () => checkAnswer(choice, btn);
                container.appendChild(btn);
            });
        }

        function checkAnswer(choice, btn) {
            const qData = questions[currentQ];
            if(choice === qData.a) {
                score++;
                btn.classList.add('correct');
            } else {
                btn.classList.add('wrong');
            }
            
            setTimeout(() => {
                currentQ++;
                if(currentQ < questions.length) showQuestion();
                else finishGame();
            }, 600);
        }

        function finishGame() {
            clearInterval(timerInterval);
            const name = document.getElementById('player-name').value;

            // ✅ บันทึกลง Firebase สำหรับดูใน Admin
            database.ref('scores/').push({ name, score, time: seconds });

            // ✅ บันทึกลง LocalStorage (กันทำซ้ำ และสำรองข้อมูล)
            let localScores = JSON.parse(localStorage.getItem('studentScores')) || [];
            localScores.push({ name, score, time: seconds });
            localStorage.setItem('studentScores', JSON.stringify(localScores));
            localStorage.setItem("hardware_quiz_done", "true");

            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('final-score').innerText = `คุณ ${name} ได้คะแนน ${score} / 10`;
            document.getElementById('final-time').innerText = `ใช้เวลา ${seconds} วินาที`;
        }
    </script>
</body>
</html>
