<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking - Computer Case Hero</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --neon-blue: #00f2ff;
            --deep-dark: #020617;
            --card-bg: rgba(15, 23, 42, 0.9);
            --gold: #fbbf24;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background: var(--deep-dark);
            color: #e2e8f0;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 30px;
            border: 1px solid rgba(0, 242, 255, 0.3);
            text-align: center;
        }

        .rank-item {
            display: flex;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            margin: 10px 0;
            padding: 15px;
            border-radius: 12px;
        }

        #cert-section {
            margin-top: 20px;
            padding: 20px;
            border-top: 1px solid rgba(0, 242, 255, 0.2);
            display: none; /* เริ่มต้นซ่อนไว้ */
        }

        .btn-download {
            background: var(--gold);
            color: black;
            padding: 12px 24px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <i class="fa-solid fa-microchip" style="font-size: 3rem; color: var(--neon-blue);"></i>
        <h2>COMPUTER CASE HERO</h2>
        <p>10 อันดับผู้กล้าที่คะแนนสูงสุด</p>

        <div id="leaderboard-list">
            <p>กำลังโหลดข้อมูลจากระบบ...</p>
        </div>

        <div id="cert-section">
            <h3 style="color: var(--gold);">🎖️ คุณได้รับเกียรติบัตร!</h3>
            <button onclick="generateCertificate()" class="btn-download">
                <i class="fa-solid fa-download"></i> ดาวน์โหลดเกียรติบัตร (A4)
            </button>
        </div>

        <a href="index.html" style="color: #64748b; text-decoration: none; display: block; margin-top: 20px;">
            <i class="fa-solid fa-chevron-left"></i> กลับไปหน้าเรียนรู้
        </a>
    </div>

    <canvas id="certCanvas" width="1200" height="848" style="display:none;"></canvas>

    <script>
        // --- ส่วนที่ 1: ตั้งค่า Firebase ---
        const firebaseConfig = {
            apiKey: "AIzaSyAK5UMFATyhnQlq3EDLmG7agFqTKh0BYCM",
            authDomain: "smartcom-ar-quiz.firebaseapp.com",
            projectId: "smartcom-ar-quiz",
            databaseURL: "https://smartcom-ar-quiz-default-rtdb.firebaseio.com/",
            storageBucket: "smartcom-ar-quiz.appspot.com",
            messagingSenderId: "367243958931", 
            appId: "1:367243958931:web:3e3c66f54668b8ec66b8ec" 
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // --- ส่วนที่ 2: ดึงข้อมูลคะแนน ---
        database.ref('scores/').on('value', (snapshot) => {
            const board = document.getElementById('leaderboard-list');
            board.innerHTML = "";
            let data = [];
            
            snapshot.forEach(child => { data.push(child.val()); });
            data.sort((a, b) => b.score - a.score);

            if (data.length === 0) {
                board.innerHTML = "<p>ยังไม่มีข้อมูลคะแนนในขณะนี้</p>";
            } else {
                data.slice(0, 10).forEach((item, index) => {
                    board.innerHTML += `
                        <div class="rank-item">
                            <span>${index + 1}. ${item.name}</span>
                            <span style="color: var(--neon-blue)">${item.score} แต้ม</span>
                        </div>
                    `;
                });
            }
        }, (error) => {
            console.error(error);
            document.getElementById('leaderboard-list').innerHTML = "<p style='color:red'>กรุณาตั้งค่า Rules ใน Firebase เป็น Public</p>";
        });

        // --- ส่วนที่ 3: ตรวจสอบสิทธิ์ดาวน์โหลด ---
        window.onload = () => {
            const lastScore = parseInt(localStorage.getItem('lastScore') || "0");
            // ถ้ามีคะแนน หรือ เป็นคุณครูทดสอบ (พิมพ์ชื่อในเครื่องนั้นแล้ว) ให้แสดงปุ่ม
            if (lastScore >= 5 || localStorage.getItem('studentName')) {
                document.getElementById('cert-section').style.display = 'block';
            }
        };

        // --- ส่วนที่ 4: ฟังก์ชันวาดเกียรติบัตร (A4) ---
        function generateCertificate() {
            const canvas = document.getElementById('certCanvas');
            const ctx = canvas.getContext('2d');
            const name = localStorage.getItem('studentName') || "ผู้กล้า SmartCom";
            const score = localStorage.getItem('lastScore') || "0";

            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // ขอบทอง
            ctx.strokeStyle = "#fbbf24";
            ctx.lineWidth = 30;
            ctx.strokeRect(50, 50, canvas.width - 100, canvas.height - 100);

            ctx.textAlign = "center";
            ctx.fillStyle = "#1e293b";
            ctx.font = "bold 60px Prompt";
            ctx.fillText("เกียรติบัตรฉบับนี้ให้ไว้เพื่อแสดงว่า", canvas.width/2, 250);

            ctx.fillStyle = "#b45309";
            ctx.font = "bold 90px Prompt";
            ctx.fillText(name, canvas.width/2, 400);

            ctx.fillStyle = "#334155";
            ctx.font = "40px Prompt";
            ctx.fillText(`ได้ผ่านการทดสอบ COMPUTER CASE HERO ด้วยคะแนน ${score} แต้ม`, canvas.width/2, 530);

            ctx.font = "italic 30px Prompt";
            ctx.fillText(`ให้ไว้ ณ วันที่ ${new Date().toLocaleDateString('th-TH')}`, canvas.width/2, 650);

            // ดาวน์โหลด
            const link = document.createElement('a');
            link.download = `Cert_${name}.png`;
            link.href = canvas.toDataURL();
            link.click();
        }
    </script>
</body>
</html>
