<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking - Computer Case Hero</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --neon-blue: #00f2ff;
            --deep-dark: #020617;
            --card-bg: rgba(15, 23, 42, 0.8);
            --gold: #fbbf24;
            --silver: #94a3b8;
            --bronze: #b45309;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background: var(--deep-dark);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 242, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 242, 255, 0.05) 0%, transparent 50%);
            color: #e2e8f0;
            margin: 0;
            padding: 20px 10px;
            min-height: 100vh;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 30px 20px;
            border: 1px solid rgba(0, 242, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.1);
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header i { font-size: 2.5rem; color: var(--neon-blue); margin-bottom: 10px; filter: drop-shadow(0 0 8px rgba(0, 242, 255, 0.5)); }
        h2 { margin: 0; font-weight: 700; letter-spacing: 1px; color: var(--neon-blue); text-transform: uppercase; }

        .board { display: flex; flex-direction: column; gap: 12px; }

        .rank-item {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            padding: 15px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.3s;
        }

        /* --- เอฟเฟกต์แสงไฟกะพริบสำหรับอันดับ 1 --- */
        @keyframes goldGlow {
            0% { box-shadow: 0 0 5px rgba(251, 191, 36, 0.3); border-color: rgba(251, 191, 36, 0.5); }
            50% { box-shadow: 0 0 20px rgba(251, 191, 36, 0.6); border-color: rgba(251, 191, 36, 1); }
            100% { box-shadow: 0 0 5px rgba(251, 191, 36, 0.3); border-color: rgba(251, 191, 36, 0.5); }
        }

        .rank-item.top-1 {
            background: rgba(251, 191, 36, 0.1);
            animation: goldGlow 2s infinite; /* สั่งให้กะพริบตลอดเวลา */
            transform: scale(1.03);
            margin-bottom: 8px;
        }

        .rank-item.top-1 .student-name { color: var(--gold); font-size: 1.2rem; }

        /* อันดับ 2-3 ทั่วไป */
        .rank-item.top-2 { border-color: var(--silver); }
        .rank-item.top-3 { border-color: var(--bronze); }

        .rank-number { width: 40px; font-weight: 700; font-size: 1.2rem; color: #475569; }
        .rank-item.top-1 .rank-number { color: var(--gold); font-size: 1.5rem; }

        .student-info { flex-grow: 1; }
        .student-name { display: block; font-weight: 600; font-size: 1rem; }
        .score-wrap { text-align: right; }
        .score-val { display: block; font-size: 1.2rem; font-weight: 700; color: var(--neon-blue); }
        .score-label { font-size: 0.7rem; color: #64748b; text-transform: uppercase; }

        .footer-btn { display: block; text-align: center; margin-top: 30px; color: #64748b; text-decoration: none; font-size: 0.9rem; transition: 0.3s; }
        .footer-btn:hover { color: var(--neon-blue); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <i class="fa-solid fa-microchip"></i>
            <h2>Computer Case Hero</h2>
            <p style="font-size: 0.8rem; color: #64748b;">10 อันดับผู้กล้าที่คะแนนสูงสุด</p>
        </div>

        <div class="board" id="leaderboard-list">
            <div style="text-align:center; padding: 20px; color: #475569;">กำลังเชื่อมต่อระบบ...</div>
        </div>

        <a href="index.html" class="footer-btn">
            <i class="fa-solid fa-chevron-left"></i> กลับไปหน้าเรียนรู้
        </a>
    </div>

    <div id="cert-section" style="display:none; text-align: center; margin-top: 20px; padding: 20px; border-top: 1px dashed rgba(0, 242, 255, 0.3);">
    <h3 style="color: var(--gold);"><i class="fa-solid fa-medal"></i> ยินดีด้วย! คุณได้รับเกียรติบัตร</h3>
    <button onclick="generateCertificate()" class="footer-btn" style="background: var(--gold); color: black; padding: 10px 20px; border-radius: 10px; font-weight: bold; border: none; cursor: pointer;">
        <i class="fa-solid fa-download"></i> ดาวน์โหลดเกียรติบัตรของคุณ
    </button>
</div>

<canvas id="certCanvas" width="800" height="565" style="display:none;"></canvas>

    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAK5UMFATyhnQlq3EDLmG7agFqTKh0BYCM",
            authDomain: "smartcom-ar-quiz.firebaseapp.com",
            projectId: "smartcom-ar-quiz",
            databaseURL: "https://smartcom-ar-quiz-default-rtdb.firebaseio.com/",
            storageBucket: "smartcom-ar-quiz.appspot.com",
            messagingSenderId: "367243958931", 
            appId: "1:367243958931:web:3e3c66f54668b8ec66b8ec" 
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let firstLoad = true; // ใช้เช็คเพื่อยิงพลุแค่ตอนเข้าหน้าครั้งแรก

        database.ref('scores/').on('value', (snapshot) => {
            let data = [];
            snapshot.forEach(child => { data.push(child.val()); });
            data.sort((a, b) => b.score - a.score || a.time - b.time);
            
            const board = document.getElementById('leaderboard-list');
            board.innerHTML = "";
            
            data.slice(0, 10).forEach((item, index) => {
                const rank = index + 1;
                let topClass = rank === 1 ? 'top-1' : rank === 2 ? 'top-2' : rank === 3 ? 'top-3' : '';
                let medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank;

                board.innerHTML += `
                    <div class="rank-item ${topClass}">
                        <div class="rank-number">${medal}</div>
                        <div class="student-info">
                            <span class="student-name">${item.name}</span>
                        </div>
                        <div class="score-wrap">
                            <span class="score-val">${item.score}</span>
                            <span class="score-label">Points</span>
                        </div>
                    </div>
                `;
            });

            // --- ฟังก์ชันยิงพลุฉลองอันดับ 1 ---
            if (firstLoad && data.length > 0) {
                fireConfetti();
                firstLoad = false;
            }
        });

        function fireConfetti() {
            var duration = 3 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 3,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#00f2ff', '#fbbf24']
                });
                confetti({
                    particleCount: 3,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#00f2ff', '#fbbf24']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        // เพิ่มฟังก์ชันเสียงในจุดที่พลุทำงาน
function fireConfetti() {
    // 1. เพิ่มเสียงฉลอง (Success/Cheer)
    const cheerSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3');
    cheerSound.volume = 0.4;
    cheerSound.play();

    // 2. โค้ดพลุเดิมของคุณครู
    var duration = 3 * 1000;
    var end = Date.now() + duration;

    (function frame() {
        confetti({
            particleCount: 3,
            angle: 60,
            spread: 55,
            origin: { x: 0 },
            colors: ['#00f2ff', '#fbbf24']
        });
        confetti({
            particleCount: 3,
            angle: 120,
            spread: 55,
            origin: { x: 1 },
            colors: ['#00f2ff', '#fbbf24']
        });

        if (Date.now() < end) {
            requestAnimationFrame(frame);
        }
    }());
}

        // ฟังก์ชันสร้างและดาวน์โหลดเกียรติบัตร
function generateCertificate() {
    const canvas = document.getElementById('certCanvas');
    const ctx = canvas.getContext('2d');
    
    // ดึงชื่อและคะแนนจาก LocalStorage (ที่เก็บไว้ตอนทำข้อสอบหน้าแรก)
    const studentName = localStorage.getItem('studentName') || "ผู้กล้า SmartCom";
    const studentScore = localStorage.getItem('lastScore') || "0";
    
    // 1. วาดพื้นหลัง (สไตล์ไฮเทค)
    ctx.fillStyle = '#020617';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // วาดขอบนีออน
    ctx.strokeStyle = '#00f2ff';
    ctx.lineWidth = 15;
    ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);
    
    // 2. ใส่หัวข้อ
    ctx.fillStyle = '#00f2ff';
    ctx.font = 'bold 40px Prompt';
    ctx.textAlign = 'center';
    ctx.fillText('เกียรติบัตรผู้ผ่านการทดสอบ', canvas.width / 2, 100);
    
    ctx.fillStyle = '#ffffff';
    ctx.font = '25px Prompt';
    ctx.fillText('ขอมอบเกียรติบัตรฉบับนี้เพื่อแสดงว่า', canvas.width / 2, 160);
    
    // 3. ใส่ชื่อนักเรียน (ตัวใหญ่และเด่น)
    ctx.fillStyle = '#fbbf24'; // สีทอง
    ctx.font = 'bold 50px Prompt';
    ctx.fillText(studentName, canvas.width / 2, 250);
    
    // 4. รายละเอียดเนื้อหา
    ctx.fillStyle = '#ffffff';
    ctx.font = '22px Prompt';
    ctx.fillText('ได้ผ่านการทดสอบเรื่ององค์ประกอบของ Computer Case', canvas.width / 2, 320);
    ctx.fillText(`ด้วยคะแนนยอดเยี่ยมสะสมรวมทั้งสิ้น ${studentScore} คะแนน`, canvas.width / 2, 360);
    
    // 5. ใส่โลโก้หรือไอคอน
    ctx.font = '60px FontAwesome';
    ctx.fillStyle = 'rgba(0, 242, 255, 0.2)';
    ctx.fillText('', canvas.width / 2, 480); // ไอคอนคอมพิวเตอร์
    
    // 6. วันที่และลายเซ็นสมมติ
    ctx.fillStyle = '#64748b';
    ctx.font = '18px Prompt';
    const date = new Date().toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });
    ctx.fillText(`ให้ไว้ ณ วันที่ ${date}`, canvas.width / 2, 420);
    ctx.fillText('SmartCom Digital Learning System', canvas.width / 2, 520);

    // 7. ดาวน์โหลดเป็นรูปภาพ
    const link = document.createElement('a');
    link.download = `Certificate_${studentName}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
}

// เช็คเงื่อนไข: ถ้าคะแนนถึงเกณฑ์ (เช่น >= 5) ให้โชว์ปุ่มรับเกียรติบัตร
window.addEventListener('load', () => {
    const score = parseInt(localStorage.getItem('lastScore') || "0");
    if (score >= 5) { // คุณครูเปลี่ยนเลข 5 เป็นคะแนนเกณฑ์ที่ต้องการได้ครับ
        document.getElementById('cert-section').style.display = 'block';
    }
});
        
    </script>
</body>
</html>
