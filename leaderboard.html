<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking - Computer Case Hero</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --neon-blue: #00f2ff;
            --deep-dark: #020617;
            --card-bg: rgba(15, 23, 42, 0.8);
            --gold: #fbbf24;
            --silver: #94a3b8;
            --bronze: #b45309;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background: var(--deep-dark);
            background-image: radial-gradient(circle at 20% 30%, rgba(0, 242, 255, 0.05) 0%, transparent 50%),
                              radial-gradient(circle at 80% 70%, rgba(0, 242, 255, 0.05) 0%, transparent 50%);
            color: #e2e8f0;
            margin: 0;
            padding: 20px 10px;
            min-height: 100vh;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 30px 20px;
            border: 1px solid rgba(0, 242, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.1);
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header i { font-size: 2.5rem; color: var(--neon-blue); margin-bottom: 10px; filter: drop-shadow(0 0 8px rgba(0, 242, 255, 0.5)); }
        h2 { margin: 0; font-weight: 700; letter-spacing: 1px; color: var(--neon-blue); text-transform: uppercase; }

        .board { display: flex; flex-direction: column; gap: 12px; }

        .rank-item {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            padding: 15px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.3s;
        }

        .rank-item.top-1 {
            background: rgba(251, 191, 36, 0.1);
            animation: goldGlow 2s infinite;
            transform: scale(1.03);
            margin-bottom: 8px;
        }

        @keyframes goldGlow {
            0%, 100% { box-shadow: 0 0 5px rgba(251, 191, 36, 0.3); border-color: rgba(251, 191, 36, 0.5); }
            50% { box-shadow: 0 0 20px rgba(251, 191, 36, 0.6); border-color: rgba(251, 191, 36, 1); }
        }

        .rank-number { width: 40px; font-weight: 700; font-size: 1.2rem; }
        .student-info { flex-grow: 1; }
        .student-name { display: block; font-weight: 600; font-size: 1rem; }
        .score-val { display: block; font-size: 1.2rem; font-weight: 700; color: var(--neon-blue); }

        /* ส่วนเกียรติบัตร */
        #cert-section {
            display: none;
            text-align: center;
            margin-top: 20px;
            padding: 25px;
            background: rgba(251, 191, 36, 0.05);
            border-radius: 20px;
            border: 1px dashed var(--gold);
        }

        .btn-download {
            background: linear-gradient(45deg, var(--gold), #f59e0b);
            color: #000;
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: 800;
            border: none;
            cursor: pointer;
            font-family: 'Prompt';
            font-size: 1rem;
            box-shadow: 0 4px 15px rgba(251, 191, 36, 0.3);
            transition: 0.3s;
        }

        .btn-download:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(251, 191, 36, 0.5); }

        .footer-btn { display: block; text-align: center; margin-top: 30px; color: #64748b; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <i class="fa-solid fa-microchip"></i>
            <h2>Computer Case Hero</h2>
            <p style="font-size: 0.8rem; color: #64748b;">10 อันดับผู้กล้าที่คะแนนสูงสุด</p>
        </div>

        <div class="board" id="leaderboard-list">
            <div style="text-align:center; padding: 20px; color: #475569;">กำลังเชื่อมต่อระบบ...</div>
        </div>

        <div id="cert-section">
            <h3 style="color: var(--gold); margin-top: 0;"><i class="fa-solid fa-medal"></i> ยินดีด้วย! คุณเก่งมาก</h3>
            <p style="font-size: 0.85rem; margin-bottom: 20px;">คุณผ่านเกณฑ์การทดสอบและสามารถรับเกียรติบัตรได้</p>
            <button onclick="generateCertificate()" class="btn-download">
                <i class="fa-solid fa-file-arrow-down"></i> ดาวน์โหลดเกียรติบัตร (A4)
            </button>
        </div>

        <a href="index.html" class="footer-btn">
            <i class="fa-solid fa-chevron-left"></i> กลับไปหน้าเรียนรู้
        </a>
    </div>

    <canvas id="certCanvas" width="1200" height="848" style="display:none;"></canvas>

    <script>
        // --- 1. Firebase Configuration ---
        const firebaseConfig = {
            apiKey: "AIzaSyAK5UMFATyhnQlq3EDLmG7agFqTKh0BYCM",
            authDomain: "smartcom-ar-quiz.firebaseapp.com",
            projectId: "smartcom-ar-quiz",
            databaseURL: "https://smartcom-ar-quiz-default-rtdb.firebaseio.com/",
            storageBucket: "smartcom-ar-quiz.appspot.com",
            messagingSenderId: "367243958931", 
            appId: "1:367243958931:web:3e3c66f54668b8ec66b8ec" 
        };
        
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const database = firebase.database();

        // --- 2. Load Leaderboard ---
        let firstLoad = true;
        database.ref('scores/').on('value', (snapshot) => {
            let data = [];
            snapshot.forEach(child => { data.push(child.val()); });
            data.sort((a, b) => b.score - a.score || a.time - b.time);
            
            const board = document.getElementById('leaderboard-list');
            board.innerHTML = "";
            
            data.slice(0, 10).forEach((item, index) => {
                const rank = index + 1;
                let topClass = rank === 1 ? 'top-1' : rank === 2 ? 'top-2' : rank === 3 ? 'top-3' : '';
                let medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank;

                board.innerHTML += `
                    <div class="rank-item ${topClass}">
                        <div class="rank-number">${medal}</div>
                        <div class="student-info">
                            <span class="student-name">${item.name}</span>
                        </div>
                        <div class="score-wrap">
                            <span class="score-val">${item.score}</span>
                        </div>
                    </div>
                `;
            });

            if (firstLoad && data.length > 0) {
                fireConfetti();
                firstLoad = false;
            }
        });

        // --- 3. Effects ---
        function fireConfetti() {
            const cheerSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3');
            cheerSound.volume = 0.3;
            cheerSound.play().catch(() => {});
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#00f2ff', '#fbbf24'] });
        }

        // --- 4. High-Res Certificate System (A4 Size) ---
        function generateCertificate() {
            const canvas = document.getElementById('certCanvas');
            const ctx = canvas.getContext('2d');
            
            const studentName = localStorage.getItem('studentName') || "ผู้กล้า SmartCom";
            const studentScore = localStorage.getItem('lastScore') || "0";
            
            // วาดพื้นหลังขาวสะอาด (เหมาะสำหรับพิมพ์)
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // วาดกรอบ 2 ชั้น (หรูหรา)
            ctx.strokeStyle = '#fbbf24';
            ctx.lineWidth = 20;
            ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);
            ctx.strokeStyle = '#020617';
            ctx.lineWidth = 2;
            ctx.strokeRect(60, 60, canvas.width - 120, canvas.height - 120);
            
            // หัวข้อ
            ctx.textAlign = 'center';
            ctx.fillStyle = '#1e293b';
            ctx.font = 'bold 50px Prompt';
            ctx.fillText('เกียรติบัตรฉบับนี้ให้ไว้เพื่อแสดงว่า', canvas.width / 2, 220);
            
            // ชื่อนักเรียน
            ctx.fillStyle = '#b45309'; 
            ctx.font = 'bold 80px Prompt';
            ctx.fillText(studentName, canvas.width / 2, 350);
            
            // เนื้อหา
            ctx.fillStyle = '#334155';
            ctx.font = '35px Prompt';
            ctx.fillText('ได้ผ่านการทดสอบวัดความรู้พื้นฐานคอมพิวเตอร์ (Hardware AR)', canvas.width / 2, 450);
            ctx.font = 'bold 40px Prompt';
            ctx.fillText(`คะแนนที่ทำได้: ${studentScore} คะแนน`, canvas.width / 2, 520);
            
            // --- ส่วนลายเซ็นและตราประทับ ---
            
            // 1. ตราประทับ Golden Seal (วาดสด)
            const sealX = canvas.width / 2;
            const sealY = 680;
            ctx.save();
            ctx.translate(sealX, sealY);
            ctx.beginPath();
            for (let i = 0; i < 30; i++) {
                ctx.rotate(Math.PI / 15);
                ctx.lineTo(0, 70);
                ctx.lineTo(5, 60);
            }
            ctx.fillStyle = '#fbbf24';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(0, 0, 55, 0, Math.PI * 2);
            ctx.fillStyle = '#f59e0b';
            ctx.fill();
            ctx.fillStyle = 'white';
            ctx.font = 'bold 20px Prompt';
            ctx.fillText('SmartCom', 0, 5);
            ctx.fillText('CERTIFIED', 0, 25);
            ctx.restore();

            // 2. ลายเซ็นดิจิทัล (ครูนุช)
            ctx.font = 'italic 40px cursive';
            ctx.fillStyle = '#1e3a8a';
            ctx.fillText('Nuch_Ampromsup', canvas.width - 300, 680); // ลายเซ็นสมมติ
            ctx.beginPath();
            ctx.strokeStyle = '#1e3a8a';
            ctx.lineWidth = 3;
            ctx.moveTo(canvas.width - 450, 700);
            ctx.lineTo(canvas.width - 150, 700);
            ctx.stroke();
            
            ctx.fillStyle = '#475569';
            ctx.font = '25px Prompt';
            ctx.fillText('(นางสาวนุช อัมพรมทรัพย์)', canvas.width - 300, 740);
            ctx.fillText('ครูผู้สอน/ผู้พัฒนาระบบ', canvas.width - 300, 775);

            // วันที่
            const date = new Date().toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });
            ctx.font = '25px Prompt';
            ctx.fillText(`ให้ไว้ ณ วันที่ ${date}`, canvas.width / 2, 600);

            // ส่งออกไฟล์
            const link = document.createElement('a');
            link.download = `Certificate_${studentName}.png`;
            link.href = canvas.toDataURL('image/png', 1.0);
            link.click();
        }

        // --- 5. Check Eligibility ---
        window.addEventListener('load', () => {
            const score = parseInt(localStorage.getItem('lastScore') || "0");
            if (score >= 5) {
                document.getElementById('cert-section').style.display = 'block';
            }
        });
    </script>
</body>
</html>
