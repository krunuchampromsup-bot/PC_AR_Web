<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR View - Computer Case</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-blue: #00f2ff;
        }
        body {
            margin: 0;
            background-color: #050a14;
            font-family: 'Prompt', sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            padding: 20px;
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(0, 242, 255, 0.2);
        }

        model-viewer {
            width: 100%;
            flex-grow: 1;
            background-color: transparent;
        }

        /* --- ปุ่มส่อง AR --- */
        .ar-button {
            background-color: var(--neon-blue);
            border-radius: 50px;
            border: none;
            padding: 12px 24px;
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            color: #050a14;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.5);
            z-index: 10;
        }

        /* --- ปุ่มย้อนกลับ --- */
        .back-btn {
            position: absolute;
            top: 25px;
            left: 20px;
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
            background: rgba(255,255,255,0.1);
            padding: 8px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 20;
        }

        /* --- ✅ ปุ่มฟังเสียงบรรยาย --- */
        .audio-control {
            position: absolute;
            top: 25px;
            right: 20px;
            z-index: 20;
            background: rgba(0, 242, 255, 0.2);
            border: 1px solid var(--neon-blue);
            color: white;
            padding: 10px 18px;
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            font-family: 'Prompt', sans-serif;
        }

        .audio-control:hover {
            background: var(--neon-blue);
            color: #050a14;
            box-shadow: 0 0 15px var(--neon-blue);
        }

        .audio-control.playing {
            background: #ff00cc;
            border-color: #ff00cc;
            color: white;
        }

        .info-panel {
            padding: 25px;
            background: rgba(7, 15, 30, 0.9);
            border-top: 2px solid var(--neon-blue);
        }
/* ปรับปรุงส่วน Header ของหน้า AR View ให้รองรับมือถือ */
.ar-header-container {
    display: flex;
    flex-direction: column; /* จัดให้ปุ่มกับข้อความอยู่คนละบรรทัดบนมือถือ */
    align-items: center;
    gap: 15px;
    padding: 20px 10px;
    margin-top: 50px; /* หลบแถบ Navbar */
}

.ar-buttons-row {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 500px;
    gap: 10px;
}

/* ปรับแต่งปุ่มให้เล็กลงเล็กน้อยและอ่านง่ายบนมือถือ */
.btn-back, .btn-audio {
    flex: 1;
    padding: 10px 15px;
    border-radius: 12px;
    font-size: 0.9rem;
    white-space: nowrap;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    text-decoration: none;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid var(--neon-blue);
    color: white;
    backdrop-filter: blur(5px);
}

/* ส่วนหัวข้อ (Title) */
.ar-title-section {
    text-align: center;
}

.ar-title-section h1 {
    font-size: 1.8rem;
    margin: 0;
    color: white;
    line-height: 1.2;
}

.ar-title-section p {
    font-size: 1.2rem;
    color: var(--neon-blue);
    margin: 5px 0 0 0;
}

@media (max-width: 480px) {
    .ar-title-section h1 { font-size: 1.5rem; }
    .ar-title-section p { font-size: 1rem; }
    .btn-back, .btn-audio { font-size: 0.85rem; }
}
        
    </style>
</head>
<body>

    <audio id="caseAudio" src="CASE.mp3"></audio>

  <div class="ar-header-container">
    <div class="ar-buttons-row">
        <a href="index.html" class="btn-back">
            <i class="fas fa-arrow-left"></i> ย้อนกลับ
        </a>
        <button class="btn-audio" onclick="playAudio()">
            <i class="fas fa-volume-up"></i> ฟังเสียงบรรยาย
        </button>
    </div>

    <div class="ar-title-section">
        <h1>Computer Case</h1>
        <p>Model View</p>
    </div>
</div>

    <header>
        <h2>Computer Case - Test Model View</h2>
    </header>

    <model-viewer 
        src="case.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        auto-rotate 
        shadow-intensity="1">
        
        <button slot="ar-button" class="ar-button">
            ✨ ส่องดูโมเดลในโลกจริง (AR)
        </button>
    </model-viewer>

    <div class="info-panel">
        <h3 style="color: var(--neon-blue); margin: 0 0 10px 0;">เกร็ดความรู้เรื่อง CASE</h3>
        <p style="margin: 0; line-height: 1.6;">เคส (Case) คือโครงภายนอกที่ทำหน้าที่ห่อหุ้มและปกป้องอุปกรณ์ภายในคอมพิวเตอร์ ช่วยจัดระเบียบชิ้นส่วน และช่วยในเรื่องการระบายความร้อนผ่านพัดลมเคส</p>
    </div>

    <script>
        const audio = document.getElementById('caseAudio');
        const audioBtn = document.getElementById('audioBtn');
        const audioIcon = document.getElementById('audioIcon');
        const audioText = document.getElementById('audioText');

        audioBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                audioBtn.classList.add('playing');
                audioIcon.innerText = '🔊';
                audioText.innerText = 'กำลังเล่น...';
            } else {
                audio.pause();
                audioBtn.classList.remove('playing');
                audioIcon.innerText = '🔈';
                audioText.innerText = 'ฟังเสียงบรรยาย';
            }
        });

        // เมื่อเล่นจบให้รีเซ็ตปุ่ม
        audio.onended = () => {
            audioBtn.classList.remove('playing');
            audioIcon.innerText = '🔈';
            audioText.innerText = 'ฟังเสียงบรรยาย';
        };
    </script>

</body>
</html>
