<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top 10 Leaderboard - SmartCom</title>

    <style>
        :root {
            --gold: #ffd700;
            --silver: #c0c0c0;
            --bronze: #cd7f32;
            --neon-blue: #00f2ff;
            --bg-dark: #0f172a;
        }

        body { 
            font-family: 'Prompt', sans-serif; 
            background: var(--bg-dark); 
            color: white;
            padding: 10px; 
            margin: 0;
            min-height: 100vh;
        }

        .admin-card { 
            background: rgba(255, 255, 255, 0.05); 
            padding: 25px; 
            border-radius: 20px; 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 242, 255, 0.2);
            max-width: 800px; 
            margin: 20px auto; 
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--neon-blue);
            padding-bottom: 15px;
        }

        h2 { margin: 0; font-size: 1.6rem; color: var(--neon-blue); text-shadow: 0 0 10px rgba(0, 242, 255, 0.5); }

        /* ปรับปรุงปุ่มจัดการด้านบน */
        .top-nav {
            display: flex;
            gap: 10px;
        }

        .btn-home {
            background: rgba(0, 242, 255, 0.1);
            color: var(--neon-blue);
            border: 1px solid var(--neon-blue);
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: 0.3s;
        }
        .btn-home:hover { background: var(--neon-blue); color: black; }

        .btn-delete { 
            background: transparent; 
            color: #ff4d4d; 
            border: 1px solid #ff4d4d; 
            padding: 8px 15px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 0.8rem;
            transition: 0.3s;
        }
        .btn-delete:hover { background: #ff4d4d; color: white; }

        .action-btns {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .btn-action {
            padding: 10px 18px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-family: 'Prompt';
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }
        .btn-print { background: #334155; color: white; }
        .btn-excel { background: #107c10; color: white; }
        .btn-action:hover { transform: translateY(-2px); opacity: 0.9; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }

        .top-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }
        
        .table-container { border-radius: 15px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; background: transparent; }
        th { 
            background: rgba(0, 242, 255, 0.2); 
            color: var(--neon-blue); 
            padding: 15px; 
            text-transform: uppercase;
            font-size: 0.9rem;
        }
        td { padding: 18px 15px; text-align: center; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 1.1rem; }

        .rank-1 { color: var(--gold); font-weight: 700; background: rgba(255, 215, 0, 0.05); }
        .rank-2 { color: var(--silver); font-weight: 700; }
