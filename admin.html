<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top 10 Leaderboard - SmartCom</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --gold: #ffd700;
            --silver: #c0c0c0;
            --bronze: #cd7f32;
            --neon-blue: #00f2ff;
            --bg-dark: #0f172a;
        }

        body { 
            font-family: 'Prompt', sans-serif; 
            background: var(--bg-dark); 
            color: white;
            padding: 10px; 
            margin: 0;
            min-height: 100vh;
        }

        .admin-card { 
            background: rgba(255, 255, 255, 0.05); 
            padding: 25px; 
            border-radius: 20px; 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 242, 255, 0.2);
            max-width: 800px; 
            margin: 20px auto; 
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--neon-blue);
            padding-bottom: 15px;
        }

        h2 { margin: 0; font-size: 1.6rem; color: var(--neon-blue); text-shadow: 0 0 10px rgba(0, 242, 255, 0.5); }

        .btn-delete { 
            background: transparent; 
            color: #ff4d4d; 
            border: 1px solid #ff4d4d; 
            padding: 8px 15px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 0.8rem;
            transition: 0.3s;
        }
        .btn-delete:hover { background: #ff4d4d; color: white; }

        .top-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }

        .table-container { border-radius: 15px; overflow: hidden; }

        table { width: 100%; border-collapse: collapse; background: transparent; }

        th { 
            background: rgba(0, 242, 255, 0.2); 
            color: var(--neon-blue); 
            padding: 15px; 
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        td { padding: 18px 15px; text-align: center; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 1.1rem; }

        /* จัดอันดับ 1-3 */
        .rank-1 { color: var(--gold); font-weight: 700; background: rgba(255, 215, 0, 0.05); }
        .rank-2 { color: var(--silver); font-weight: 700; }
        .rank-3 { color: var(--bronze); font-weight: 700; }

        .medal { font-size: 1.4rem; margin-right: 5px; }

        .name-cell { text-align: left !important; padding-left: 40px !important; }

        .score-badge {
            background: var(--neon-blue);
            color: #000;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 700;
        }

        @media (max-width: 600px) {
            .name-cell { padding-left: 15px !important; }
            td, th { font-size: 0.9rem; padding: 12px 8px; }
        }
    </style>
</head>
<body>

    <div class="admin-card">
        <div class="header-flex">
            <h2>🏆 TOP 10 LEADERBOARD</h2>
            <button class="btn-delete" onclick="resetScores()">ล้างข้อมูล</button>
        </div>

        <div class="top-stats">
            <div class="stat-box">
                <small>ผู้เข้าสอบทั้งหมด</small>
                <div id="student-count" style="font-size: 1.5rem; font-weight: bold; color: var(--neon-blue);">0</div>
            </div>
            <div class="stat-box">
                <small>คะแนนเฉลี่ย</small>
                <div id="avg-score" style="font-size: 1.5rem; font-weight: bold; color: var(--pink-neon);">0.0</div>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th width="15%">อันดับ</th>
                        <th width="45%" class="name-cell">ชื่อผู้กล้า</th>
                        <th width="20%">คะแนน</th>
                        <th width="20%">เวลา (วินาที)</th>
                    </tr>
                </thead>
                <tbody id="admin-table-body">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAK5UMFATyhnQlq3EDLmG7agFqTKh0BYCM",
            authDomain: "smartcom-ar-quiz.firebaseapp.com",
            projectId: "smartcom-ar-quiz",
            databaseURL: "https://smartcom-ar-quiz-default-rtdb.firebaseio.com/",
            storageBucket: "smartcom-ar-quiz.appspot.com",
            messagingSenderId: "367243958931", 
            appId: "1:367243958931:web:3e3c66f54668b8ec66b8ec" 
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function loadScores() {
            // ดึงข้อมูลทั้งหมดมาประมวลผล Top 10
            database.ref('scores/').on('value', (snapshot) => {
                let allData = [];
                snapshot.forEach((child) => {
                    allData.push(child.val());
                });

                // 1. เรียงลำดับ: คะแนนมากที่สุดก่อน ถ้าเท่ากันให้ใช้เวลาน้อยที่สุด
                allData.sort((a, b) => b.score - a.score || a.time - b.time);

                // 2. ตัดเอาแค่ Top 10
                const top10 = allData.slice(0, 10);

                // 3. คำนวณสถิติภาพรวม
                const totalStudents = allData.length;
                const avgScore = totalStudents > 0 
                    ? (allData.reduce((acc, curr) => acc + curr.score, 0) / totalStudents).toFixed(1) 
                    : 0;

                document.getElementById('student-count').innerText = totalStudents;
                document.getElementById('avg-score').innerText = avgScore;

                renderTable(top10);
            });
        }

        function renderTable(list) {
            const tbody = document.getElementById('admin-table-body');
            tbody.innerHTML = "";
            
            if (list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="color: #666; padding: 50px;">รอผู้ท้าชิงคนแรก...</td></tr>`;
                return;
            }

            list.forEach((item, index) => {
                let rankClass = "";
                let medal = "";
                
                if(index === 0) { rankClass = "rank-1"; medal = "🥇"; }
                else if(index === 1) { rankClass = "rank-2"; medal = "🥈"; }
                else if(index === 2) { rankClass = "rank-3"; medal = "🥉"; }
                else { medal = (index + 1); }

                const row = `
                    <tr class="${rankClass}">
                        <td>${medal}</td>
                        <td class="name-cell">${item.name}</td>
                        <td><span class="score-badge">${item.score}</span></td>
                        <td style="opacity: 0.7">${item.time}s</td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        function resetScores() {
            if(confirm("🚨 คำเตือน: คุณครูต้องการรีเซ็ต Leaderboard ทั้งหมดใช่หรือไม่?")) {
                database.ref('scores/').remove().then(() => {
                    alert("ล้างข้อมูลเรียบร้อยแล้ว");
                });
            }
        }

        window.onload = loadScores;
    </script>
</body>
</html>
