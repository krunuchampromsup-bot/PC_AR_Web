<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard สำหรับคุณครู - SmartCom</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --pink-neon: #ff00cc;
            --bg-dark: #f4f7f6;
        }

        body { 
            font-family: 'Prompt', sans-serif; 
            background: var(--bg-dark); 
            padding: 10px; 
            margin: 0;
        }

        .admin-card { 
            background: white; 
            padding: 20px; 
            border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            max-width: 900px; 
            margin: 20px auto; 
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        h2 { margin: 0; color: #333; font-size: 1.4rem; display: flex; align-items: center; gap: 10px; }

        .btn-delete { 
            background: #ff4d4d; 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold;
            transition: 0.3s;
        }
        
        .btn-delete:hover { background: #e60000; transform: scale(1.05); }

        .status-bar {
            background: #e0fbfc;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: #005f73;
            font-weight: 600;
            border-left: 5px solid var(--neon-blue);
        }

        .table-container { overflow-x: auto; border-radius: 10px; box-shadow: inset 0 0 10px rgba(0,0,0,0.05); }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            background: white;
            min-width: 500px;
        }

        th, td { 
            padding: 15px; 
            text-align: center; 
            border-bottom: 1px solid #eee; 
        }

        th { 
            background-color: var(--neon-blue); 
            color: #000; 
            font-weight: 600;
            position: sticky;
            top: 0;
        }

        tr:nth-child(even) { background-color: #f9f9f9; }
        tr:hover { background-color: #f1fdff; transition: 0.2s; }

        @media (max-width: 600px) {
            h2 { font-size: 1.1rem; }
            .btn-delete { width: 100%; order: 2; }
            .header-flex { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

    <div class="admin-card">
        <div class="header-flex">
            <h2>📊 สรุปผลคะแนนวิชาคอมพิวเตอร์ (ครูนุช)</h2>
            <button class="btn-delete" onclick="resetScores()">ล้างข้อมูลคะแนนทั้งหมด</button>
        </div>

        <div class="status-bar">
            🟢 นักเรียนที่สอบแล้ว: <span id="student-count">0</span> คน
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ลำดับ</th>
                        <th>ชื่อนักเรียน</th>
                        <th>คะแนน (10)</th>
                        <th>เวลา (วินาที)</th>
                    </tr>
                </thead>
                <tbody id="admin-table-body">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        // ✅ 1. ตั้งค่า Firebase (ต้องมี databaseURL เพื่อความเสถียร)
        const firebaseConfig = {
            apiKey: "AIzaSyAK5UMFATyhnQlq3EDLmG7agFqTKh0BYCM",
            authDomain: "smartcom-ar-quiz.firebaseapp.com",
            projectId: "smartcom-ar-quiz",
            databaseURL: "https://smartcom-ar-quiz-default-rtdb.firebaseio.com/", // **ตรวจสอบ URL ใน Firebase Console ของคุณครู**
            storageBucket: "smartcom-ar-quiz.appspot.com",
            messagingSenderId: "367243958931", 
            appId: "1:367243958931:web:3e3c66f54668b8ec66b8ec" 
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // ✅ 2. ฟังก์ชันโหลดข้อมูล (ปรับปรุง Logic การ Merge)
        function loadScores() {
            database.ref('scores/').orderByChild('score').on('value', (snapshot) => {
                let displayList = [];
                
                // ดึงจาก Firebase
                snapshot.forEach((child) => {
                    displayList.push(child.val());
                });

                // ถ้าใน Firebase ไม่มีข้อมูล ให้ไปลองดึงจาก LocalStorage (เผื่อสอบแบบ Offline)
                if (displayList.length === 0) {
                    displayList = JSON.parse(localStorage.getItem('studentScores')) || [];
                }

                // เรียงคะแนนจากมากไปน้อย (Score Descending)
                displayList.sort((a, b) => b.score - a.score || a.time - b.time);

                renderTable(displayList);
            }, (error) => {
                console.error("Firebase Error: ", error);
                // หากเชื่อมต่อ Firebase ไม่ได้ ให้ดึง LocalStorage ทันที
                const localList = JSON.parse(localStorage.getItem('studentScores')) || [];
                renderTable(localList);
            });
        }

        // ✅ 3. ฟังก์ชันสร้างแถวตาราง (เพิ่มการจัดสไตล์ตัวเลข)
        function renderTable(list) {
            const tbody = document.getElementById('admin-table-body');
            tbody.innerHTML = "";
            
            if (list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="color: #999; padding: 40px;">ยังไม่มีข้อมูลผลการทดสอบ</td></tr>`;
                document.getElementById('student-count').innerText = "0";
                return;
            }

            list.forEach((item, index) => {
                const row = `
                    <tr>
                        <td>${index + 1}</td>
                        <td style="text-align: left; padding-left: 30px;">${item.name}</td>
                        <td style="font-weight: 600; color: #2ecc71; font-size: 1.1rem;">${item.score}</td>
                        <td style="color: #666;">${item.time}</td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
            
            document.getElementById('student-count').innerText = list.length;
        }

        // ✅ 4. ฟังก์ชันล้างข้อมูล (ลบทั้ง 2 ระบบ)
        function resetScores() {
            if(confirm("คุณครูต้องการลบคะแนนทั้งหมดเพื่อเริ่มกลุ่มใหม่ใช่ไหม?\n(ข้อมูลใน Firebase และในเครื่องนี้จะถูกลบถาวร)")) {
                database.ref('scores/').remove()
                    .then(() => {
                        localStorage.removeItem('studentScores');
                        alert("ล้างข้อมูลสำเร็จ");
                        location.reload();
                    })
                    .catch((error) => {
                        alert("เกิดข้อผิดพลาดในการลบข้อมูล: " + error.message);
                    });
            }
        }

        window.onload = loadScores;
    </script>
</body>
</html>
